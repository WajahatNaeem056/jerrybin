
name: SSL Expiry Checker

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSL certificates
        shell: bash
        run: |
          shopt -s nullglob
          files=(certs/*.pem certs/*.crt)

          for file in "${files[@]}"; do
            expiry=$(openssl x509 -in "$file" -noout -enddate)
            expiry=${expiry#notAfter=}
            iso=$(date -u -d "$expiry" '+%Y-%m-%dT%H:%M:%SZ')
            echo "$(basename "$file"): $iso"
          done
          
