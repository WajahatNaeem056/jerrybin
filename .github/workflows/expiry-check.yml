
name: SSL Certificate Expiry Checker

on:
  push:
    paths:
      - 'certs/**'
      - '.github/workflows/expiry-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-expiry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SSL certificates
        shell: bash
        run: |
          shopt -s nullglob
          files=(certs/*.pem certs/*.crt)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No SSL certificates found in certs/"
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Checking: $file"

            expiry=$(openssl x509 -in "$file" -noout -enddate)
            date_value="${expiry#notAfter=}"
            iso_date=$(date -u -d "$date_value" '+%Y-%m-%dT%H:%M:%SZ')

            echo "Expiry: $iso_date"

            if ! openssl x509 -in "$file" -checkend 0 -noout; then
              echo "Status: EXPIRED"
            else
              echo "Status: VALID"
            fi
          done
          
